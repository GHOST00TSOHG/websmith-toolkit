<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;background:#0B0D17;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  h1{color:#F5F7FF;font-size:130px;margin:0;letter-spacing:-.02em}
  h1 span{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(8px);
    animation:rise .5s cubic-bezier(.16,1,.3,1) forwards}
  .bar{width:0;height:14px;border-radius:7px;background:#22D3EE;animation:grow 1.2s cubic-bezier(.83,0,.17,1) .6s forwards}
  @keyframes rise{to{opacity:1;transform:none;filter:none}}
  @keyframes grow{to{width:900px}}
</style></head><body><div class="wrap">
  <h1><span style="animation-delay:0s">HTML</span> <span style="animation-delay:.07s">fallback</span> <span style="animation-delay:.14s">render</span></h1>
  <div class="bar"></div>
</div><script>window.__duration = 3;</script></body></html>
